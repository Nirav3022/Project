{% extends 'seller\layouts\base.html' %}
{% load static %}
{% block content %}
<main class="content">
	<div class="container-fluid p-0">

        <h1 class="h3 mb-3">Add Products</h1>

        <div class="row mt-2">
        	<div class="col-sm-12">
                <div class="card">
                    <div class="card-header">
                        <h5 class="card-title">Add Products</h5>
                    </div>
                    <div class="card-body">
                        <form>
                            <div class="mb-3">
                                <label class="form-label">Product ID</label>
                                <input type="number" class="form-control" value="1" disabled>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Product Name</label>
                                <input type="text" class="form-control" placeholder="Product Name">
                            </div>

                            <div class="row">
                                <div class="mb-3 col-sm-6">
                                    <label class="form-label">Select Category</label>
                                    <select class="form-select">
                                        <option>Men's Wear</option>
                                        <option>Women's Wear</option>
                                        <option>Children's Wear</option>
                                    </select>
                                </div>
                                <div class="mb-3 col-sm-6">
                                    <label class="form-label">Select Subcategory</label>
                                    <select class="form-select">
                                        <option>Shirt</option>
                                        <option>T-Shirt</option>
                                        <option>Mobile</option>
                                    </select>
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">Description</label>
                                <textarea class="form-control" placeholder="Product Description" rows="2"></textarea>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Price</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-rupee-sign"></i></span>
                                    <input type="number" class="form-control">
                                </div>
                            </div> 

                            
                            <div class="row">
                                <div class="col-sm-6">
                                    <div class="mb-3">
                                        <label class="form-label w-100">Product Image 1</label> 
                                        <input type="file">
                                    </div>
                                </div>
                                <div class="col-sm-6">
                                    <div class="mb-3">
                                        <label class="form-label w-100">Product Image 2</label> 
                                        <input type="file">
                                    </div>
                                </div>
                            </div>
                            
                            <div class="row">
                                <div class="col-sm-6">
                                    <div class="mb-3">
                                        <label class="form-label w-100">Product Image 3</label> 
                                        <input type="file">
                                    </div>
                                </div>
                                <div class="col-sm-6">
                                    <div class="mb-3">
                                        <label class="form-label w-100">Product Image 4</label> 
                                        <input type="file">
                                    </div>
                                </div>
                            </div>
                    

                            <div class="col-sm-8 mb-3" id="sizes">
                                <label class="form-label w-100">Size and Quantity</label> 
                                <div class="row mb-3" id="sizequn1">
                                    <div class="col-sm-7">
                                        <div class="input-group">    
                                            <input type="text" class="form-control" placeholder="Size" name="size1">
                                            <input type="number" class="form-control" placeholder="Quantity" name="quantity1">
                                        </div>
                                    </div>
                                    <div class="col-sm-5" id="sqcombo1">
                                        <button class="btn btn-info" type="button" onclick="rmsizequn()"><i class="fas fa-minus"></i></button>
                                        <button class="btn btn-info mx-2" type="button" onclick="addsizequn()"><i class="fas fa-plus"></i></button>
                                    </div>
                                </div>
                                <input type="number" name="size_no" style="display: none;" id="size_no" value="1">  
                            </div>
                            

                            <a href="{% url 'seller_products_list' %}" class="btn btn-primary">Back</a>
                            <button type="submit" class="btn btn-primary mx-2">Submit</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
        
    </div>
</main>
{% endblock content %}
{% block scripts %}
    <script>
        let sq = 1;
        function addsizequn(){
            let elm = document.createElement('div');
            document.getElementById(`sqcombo${sq}`).remove();
            sq++;
            elm.className = 'row mb-3';
            elm.setAttribute('id', `sizequn${sq}`)
            elm.innerHTML = `<div class="col-sm-7">
                                <div class="input-group">    
                                    <input type="text" class="form-control" placeholder="Size" name="size${sq}">
                                    <input type="number" class="form-control" placeholder="Quantity" name="quantity${sq}">
                                </div>
                            </div>
                            <div class="col-sm-5" id="sqcombo${sq}">
                                <button class="btn btn-info" type="button" onclick="rmsizequn()"><i class="fas fa-minus"></i></button>
                                <button class="btn btn-info mx-2" type="button" onclick="addsizequn()"><i class="fas fa-plus"></i></button>
                            </div>`;
            sub = document.getElementById('sizes');
            sub.appendChild(elm);
            document.getElementById('size_no').value = sq;
        }
    </script>
    <script>
        function rmsizequn(){
            if (sq > 1) {
                document.getElementById(`sizequn${sq}`).remove();
                sq--;
                let plsminus = `<div class="col-sm-5" id="sqcombo${sq}">
                                    <button class="btn btn-info" type="button" onclick="rmsizequn()"><i class="fas fa-minus"></i></button>
                                    <button class="btn btn-info mx-2" type="button" onclick="addsizequn()"><i class="fas fa-plus"></i></button>
                                </div>`;
                document.getElementById(`sizequn${sq}`).innerHTML += plsminus;
                document.getElementById('size_no').value = sq;
            }
        }
    </script>
{% endblock scripts %}
